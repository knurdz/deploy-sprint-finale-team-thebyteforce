name: Compose Service

# T22 - Compose Runtime Service
#
# Validates and actually RUNS the Compose service definition: generates the
# runtime env the way a deploy would, brings the service up, waits for Docker to
# report it healthy, exercises a rolling update, and proves the restart policy
# brings it back.
#
# "docker compose config parses" only shows the YAML is well-formed. Everything
# this task is graded on - health check, restart policy, clean update, generated
# env - is behaviour, so it is tested as behaviour.
#
# Nothing here touches the VPS. Participants hold no SSH credential; the
# organizer deployer remains the only route to production.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-service-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_NAME: deploy-sprint-thebyteforce
  COMPOSE_PROJECT_NAME: deploy-sprint-thebyteforce
  APP_PORT: "8080"

jobs:
  compose:
    name: Validate and run the Compose service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the service image
        env:
          IMAGE_TAG: ${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          # Arg names must match the Dockerfile's ARG declarations exactly -
          # docker ignores unknown build args with only a warning, and the image
          # would silently report commit "local-build".
          docker build \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            --build-arg VITE_PUBLIC_URL="${{ vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}" \
            --build-arg VITE_PUBLIC_DEPLOY_LABEL="${{ vars.PUBLIC_DEPLOY_LABEL }}" \
            --tag "${IMAGE_TAG}" \
            .

      # The runtime env is GENERATED, exactly as it would be on the VPS. Secrets
      # come from the Actions environment and are written to a 0600 file that is
      # never committed.
      - name: Generate the runtime env file
        env:
          IMAGE_TAG: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS }}
        run: |
          set -euo pipefail
          chmod +x scripts/generate-runtime-env.sh
          scripts/generate-runtime-env.sh --output .env

          # Permissions are part of the guarantee, not a detail.
          mode="$(stat -c '%a' .env)"
          echo "runtime env mode: ${mode}"
          if [ "$mode" != "600" ]; then
            echo "::error::.env should be 0600, found ${mode}"
            exit 1
          fi

      - name: The runtime env must never be committable
        run: |
          set -euo pipefail
          # git must consider it ignored...
          if ! git check-ignore -q .env; then
            echo "::error::.env is not gitignored"
            exit 1
          fi
          # ...and it must not already be tracked from some earlier mistake.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git"
            exit 1
          fi
          echo ".env is ignored and untracked"

      - name: Validate the service definition
        run: |
          set -euo pipefail
          # Resolves interpolation and schema. env_file contents are NOT inlined
          # by `config`, so this output is safe to publish as evidence.
          docker compose config > compose-resolved.yml
          cat compose-resolved.yml

          # Assert the properties the task is graded on are actually present,
          # rather than trusting that nobody deleted them later.
          for key in 'restart: unless-stopped' 'healthcheck' 'read_only: true'; do
            if ! grep -q "$key" compose-resolved.yml; then
              echo "::error::resolved compose config is missing: ${key}"
              exit 1
            fi
          done
          echo "restart policy, health check and hardening present"

      - name: Start the service
        run: |
          set -euo pipefail
          docker compose up -d
          docker compose ps

      - name: Wait for Docker to report the service healthy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "${SERVICE_NAME}" 2>/dev/null || echo unknown)"
            if [ "$state" = "healthy" ]; then
              echo "healthy after ${attempt} check(s)"
              exit 0
            fi
            if [ "$state" = "unhealthy" ]; then
              echo "::error::container reported unhealthy"
              docker logs "${SERVICE_NAME}" || true
              exit 1
            fi
            sleep 2
          done
          echo "::error::service did not become healthy in time"
          docker compose ps
          docker logs "${SERVICE_NAME}" || true
          exit 1

      - name: Verify the service actually serves
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w 'GET /       -> %{http_code}\n' "http://127.0.0.1:${APP_PORT}/"
          body="$(curl -fsS "http://127.0.0.1:${APP_PORT}/health")"
          echo "GET /health -> ${body}"
          [ "$body" = "ok" ]

          served="$(curl -fsS "http://127.0.0.1:${APP_PORT}/status" \
            | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          echo "served commit: ${served}"
          if [ "$served" != "${GITHUB_SHA}" ]; then
            echo "::error::service is serving ${served}, expected ${GITHUB_SHA}"
            exit 1
          fi

      # Restart policy: the container must come back by itself after a crash or
      # a host reboot. `docker restart` is the closest honest simulation we can
      # run on a hosted runner.
      - name: Prove the service recovers on restart
        run: |
          set -euo pipefail
          docker restart "${SERVICE_NAME}" >/dev/null

          for attempt in $(seq 1 40); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "${SERVICE_NAME}" 2>/dev/null || echo unknown)"
            if [ "$state" = "healthy" ]; then
              echo "recovered and healthy after ${attempt} check(s)"
              break
            fi
            sleep 2
          done

          [ "$(docker inspect -f '{{.State.Health.Status}}' "${SERVICE_NAME}")" = "healthy" ]
          [ "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "${SERVICE_NAME}")" = "unless-stopped" ]
          curl -fsS -o /dev/null "http://127.0.0.1:${APP_PORT}/health"
          echo "restart policy is unless-stopped and the service came back"

      # Clean update: a new image tag must replace the running container without
      # leaving the old one behind and without manual intervention.
      - name: Prove a clean update replaces the running service
        run: |
          set -euo pipefail
          old_id="$(docker inspect -f '{{.Id}}' "${SERVICE_NAME}")"

          docker tag "${SERVICE_NAME}:${GITHUB_SHA}" "${SERVICE_NAME}:update-test"

          # Regenerate the env the way a real deploy would, pointing at the new
          # tag, then bring the service up again.
          IMAGE_TAG="${SERVICE_NAME}:update-test" GIT_COMMIT="${GITHUB_SHA}" \
            scripts/generate-runtime-env.sh --output .env
          docker compose up -d

          for attempt in $(seq 1 40); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "${SERVICE_NAME}" 2>/dev/null || echo unknown)"
            [ "$state" = "healthy" ] && break
            sleep 2
          done

          new_id="$(docker inspect -f '{{.Id}}' "${SERVICE_NAME}")"
          echo "container ${old_id:0:12} -> ${new_id:0:12}"
          if [ "$old_id" = "$new_id" ]; then
            echo "::error::compose did not recreate the container for the new image"
            exit 1
          fi

          [ "$(docker inspect -f '{{.State.Health.Status}}' "${SERVICE_NAME}")" = "healthy" ]
          curl -fsS -o /dev/null "http://127.0.0.1:${APP_PORT}/health"

          # Exactly one container for this service - no orphan left running.
          running="$(docker compose ps --quiet | wc -l | tr -d ' ')"
          echo "containers for this project: ${running}"
          [ "$running" = "1" ]
          echo "update replaced the service cleanly"

      - name: Compose service summary
        if: always()
        run: |
          {
            echo "## T22 Compose runtime service"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Service | \`${SERVICE_NAME}\` |"
            echo "| Image | \`${SERVICE_NAME}:${GITHUB_SHA}\` |"
            echo "| Published port | \`${APP_PORT}\` -> container \`8080\` |"
            echo "| Restart policy | \`unless-stopped\` |"
            echo "| Health check | \`wget /health\`, 15s interval, 3 retries |"
            echo "| Runtime env | generated at deploy, \`0600\`, gitignored |"
            echo "| Update behaviour | container recreated, one instance, healthy |"
            echo ""
            echo "Runtime variables live only in the generated \`.env\` on the host."
            echo "They are updated by regenerating that file from GitHub Secrets and"
            echo "re-running \`docker compose up -d\`; nothing is edited in place and"
            echo "no value is committed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: always()
        run: docker compose logs --no-color || true

      # The resolved config is safe to publish: env_file values are not inlined.
      - name: Upload compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-evidence-${{ github.sha }}
          path: compose-resolved.yml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: |
          docker compose down --remove-orphans || true
          rm -f .env
