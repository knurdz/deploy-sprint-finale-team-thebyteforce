name: Broken deploy rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Upload wrong directory
        uses: actions/upload-artifact@v4
        with:
          name: broken-deploy-output
          path: build
