# T14 - runtime server for the built site.
#
# Mirrors how the VPS serves the app: plain static files, no SPA fallback, so a
# request for a path that does not exist returns 404 instead of silently serving
# index.html. That matters because /health, /status and /api/* are real files
# written by the postbuild generators - an SPA fallback would mask a missing
# endpoint by returning the HTML shell with a 200.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The generators write these without extensions, so nginx cannot infer a
    # type. Declaring them keeps the responses honest rather than shipping
    # everything as application/octet-stream.
    location = /health {
        default_type text/plain;
    }

    location = /status {
        default_type application/json;
    }

    location /api/ {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
