name: CI

on:
  pull_request:
  push:
    branches:
      - main

# T21 - least privilege. CI reads the repository and publishes build artifacts.
# Artifact upload is governed by the Actions artifact API, not by `contents`, so
# read-only is sufficient: no job here writes to the repository, cuts a release,
# or comments on a pull request. Granting write "just in case" is how a leaked
# token in a log becomes a repository compromise instead of an inconvenience.
permissions:
  contents: read

# T21 - one CI run per ref.
#
# The asymmetry is deliberate. A superseded pull request run is cancelled: only
# the latest commit on a PR matters. A run on `main` is never cancelled, because
# `deploy.yml` chains off CI's conclusion via `workflow_run` - cancelling a main
# build would silently drop a release rather than fail it, which is the worse of
# the two outcomes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # T12: the cache is keyed off the lockfile hash, so any dependency change
      # invalidates it automatically. `id` is set so the cache-hit result can be
      # reported in the run summary rather than being invisible.
      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      # `npm ci` runs on every build, cache hit or miss. The cache only holds the
      # npm download cache (~/.npm), never node_modules, so this stays a clean
      # lockfile-exact install — the cache makes it faster, not weaker.
      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      # T12: AUDIT_POLICY=document-result. Reported, never swallowed, and never
      # used to fail the build — a transitive advisory landing overnight must not
      # block a release, but it must be visible in the run rather than silent.
      - name: Audit dependencies
        id: audit
        working-directory: team-site
        run: |
          set -uo pipefail
          if npm audit --omit=dev --audit-level=high > audit-report.txt 2>&1; then
            result="clean (no high or critical advisories)"
          else
            result="findings reported - see audit step output"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Dependency audit: $result"
          cat audit-report.txt

      - name: Report dependency pipeline status
        run: |
          {
            echo "## Dependency pipeline"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Cache key source | \`team-site/package-lock.json\` |"
            echo "| Lockfile hash | \`${{ hashFiles('team-site/package-lock.json') }}\` |"
            echo "| Cache hit | \`${{ steps.node.outputs.cache-hit || 'false' }}\` |"
            echo "| Install command | \`npm ci\` (runs on hit and miss) |"
            echo "| Audit policy | document-result (non-blocking) |"
            echo "| Audit result | ${{ steps.audit.outputs.result }} |"
            echo ""
            echo "Cache invalidation: the key is derived from the hash of"
            echo "\`team-site/package-lock.json\`. Any dependency change rewrites the"
            echo "lockfile, which changes the hash, which misses the cache and"
            echo "repopulates it. No manual cache busting is required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_TEAM_NAME: The Byte Force
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_RELEASE_ID: ${{ github.run_id }}
          TEAM_SLUG: ${{ vars.TEAM_SLUG }}
          # T05: public config only. Anything VITE_* is inlined into the client
          # bundle, so this must come from a repository variable and never from
          # a secret. Private values are supplied to deploy steps instead.
          VITE_PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL }}
          # T07 - server-side only. The key is used at build time by
          # scripts/generate-weather.mjs and never shipped to the browser.
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_CITY: Colombo
          # T10 - Web3Forms. Unlike the OpenWeather key, this one MUST reach the
          # browser: Web3Forms posts client-side, so the access key is a form
          # identifier rather than an authenticator. It is still sourced from a
          # GitHub Secret and never committed, so it can be rotated in one place
          # and stays masked in logs. Both names are provided: the VITE_ form for
          # the bundle, the plain form for the build-time evidence generator.
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          # T15 - runtime feature flag. Deliberately NOT prefixed with VITE_:
          # Vite inlines every VITE_* variable into the client bundle, which
          # would turn this into a build-time constant. Unprefixed, it is read
          # only by scripts/generate-feature-flags.mjs, which publishes the
          # resolved boolean to /api/feature-flags for the app to fetch at load.
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS }}
          # T16 - Resend email alerts. Server-side only: RESEND_API_KEY is read at
          # build time by scripts/generate-email-status.mjs and never shipped to
          # the browser (no VITE_ prefix). Sender/recipient are safe test values.
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          ALERT_RECIPIENT_EMAIL: ${{ vars.ALERT_RECIPIENT_EMAIL }}
          # T23 - release provenance. The PR number is available directly on
          # pull_request builds; on a push to main it is recovered from the merge
          # commit subject, which reads "Merge pull request #N from ...".
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: npm run build
        working-directory: team-site

      # Fail the gate before publishing. `vite build` can exit 0 while emitting
      # nothing useful (bad base path, empty entry, misconfigured outDir), and an
      # empty artifact would still upload and still be deployable. Asserting the
      # expected output here means a broken build cannot become a release
      # candidate at all, rather than failing later on the VPS.
      - name: Verify build output before publishing
        run: |
          set -euo pipefail
          test -f team-site/dist/index.html
          test -d team-site/dist/assets
          test -s team-site/dist/index.html
          echo "Build output verified: $(find team-site/dist -type f | wc -l) files"

      # T05: prove the separation instead of asserting it. Runs after the output
      # check above, so it can never pass vacuously against an empty dist/. The
      # private values are read here only to confirm they are ABSENT from the
      # bundle; they are never echoed, and GitHub masks them in logs. If anyone
      # ever prefixes a secret with VITE_, Vite inlines it into dist/ and this
      # step fails the build instead of shipping the value to every visitor.
      # T21 - PR_WORKFLOWS_GET_NO_DEPLOY_SECRETS. Both values resolve to an
      # empty string on a pull_request run, so the check skips them and says so
      # in the log. A pull request therefore never holds a deploy credential in
      # its environment, while pushes to main still verify both are absent from
      # the bundle - the check keeps full meaning exactly where the bundle is
      # about to be published.
      - name: Assert no private value reached the client bundle
        env:
          PRIVATE_DEPLOY_TOKEN: ${{ github.event_name != 'pull_request' && secrets.PRIVATE_DEPLOY_TOKEN || '' }}
          DEPLOYER_DISPATCH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.DEPLOYER_DISPATCH_TOKEN || '' }}
        run: |
          set -euo pipefail
          checked=0
          for name in PRIVATE_DEPLOY_TOKEN DEPLOYER_DISPATCH_TOKEN; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name is not configured; skipping its bundle check"
              continue
            fi
            checked=$((checked + 1))
            if grep -rqF -- "$value" team-site/dist; then
              echo "FAIL: the value of $name was found inside team-site/dist"
              exit 1
            fi
            echo "$name: value absent from the client bundle"
          done
          echo "Client bundle leak check complete ($checked secret(s) checked)."

      # T23: a manifest nobody validates is just a JSON file. Fail the build if a
      # required field is missing, if it describes a different commit than the one
      # being built, or if an integration secret leaked into it. The last check is
      # what stops this document quietly becoming a leak vector as fields grow.
      - name: Verify the release manifest
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          manifest=team-site/dist/release-manifest.json
          test -s "$manifest"

          node -e "
            const m = require('./team-site/dist/release-manifest.json');
            const required = ['commit','artifact','workflowRun','pullRequest','releaseTime','publicUrl','activeConfig'];
            const missing = required.filter((k) => !(k in m));
            if (missing.length) {
              console.error('missing required field(s): ' + missing.join(', '));
              process.exit(1);
            }
            if (m.commit !== process.env.GITHUB_SHA) {
              console.error('manifest commit ' + m.commit + ' does not match build ' + process.env.GITHUB_SHA);
              process.exit(1);
            }
            console.log('manifest complete for ' + m.shortCommit + ', tasks: ' + m.tasks.length);
          "

          for name in OPENWEATHER_API_KEY WEB3FORMS_ACCESS_KEY RESEND_API_KEY; do
            value="${!name:-}"
            if [ -n "$value" ] && grep -qF -- "$value" "$manifest"; then
              echo "::error::the value of $name appears inside the release manifest"
              exit 1
            fi
          done
          echo "no secret values present in the manifest"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist

      # T23: also published on its own so release evidence can be fetched without
      # downloading the whole site bundle.
      - name: Upload release evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: team-site/dist/release-manifest.json
          if-no-files-found: error

  # Build once, deploy many: this job consumes the exact artifact produced by
  # `build` above. It never checks out source and never runs npm, so the bytes
  # that get verified here are the same bytes that were built and tested.
  verify-release-artifact:
    name: Dry-run deploy from built artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact artifact built by CI
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: release-candidate

      - name: Verify the artifact is deployable without rebuilding
        run: |
          set -euo pipefail
          test -f release-candidate/index.html
          test -d release-candidate/assets
          echo "Artifact contents:"
          find release-candidate -type f | sort

      - name: Generate release manifest
        env:
          ARTIFACT_NAME: site-dist-${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file_count=$(find release-candidate -type f | wc -l)
          cat > release-manifest.json <<JSON
          {
            "schemaVersion": 1,
            "commit": "${COMMIT_SHA}",
            "shortCommit": "${COMMIT_SHA:0:7}",
            "artifactName": "${ARTIFACT_NAME}",
            "workflowRun": "${RUN_ID}",
            "workflowRunNumber": "${RUN_NUMBER}",
            "repository": "${REPO}",
            "ref": "${REF_NAME}",
            "fileCount": ${file_count},
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "rebuiltDuringDeploy": false
          }
          JSON
          cat release-manifest.json

      - name: Publish artifact identity to the run summary
        run: |
          set -euo pipefail
          {
            echo "## Release candidate"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Artifact | \`site-dist-${{ github.sha }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Workflow run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Rebuilt during deploy | no |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
