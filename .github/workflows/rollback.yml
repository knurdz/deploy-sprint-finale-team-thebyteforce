name: Rollback To Known-Good Release

# T04 - Manually redeploy a previously known-good release.
#
# Trigger this from the Actions tab ("Run workflow") and pass the known-good tag
# or commit SHA in the release_ref input. The job checks out that exact release,
# rebuilds its artifact, and asks the organizer deployer to publish it again - so
# we can recover from a bad deploy without any direct SSH access to the VPS.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Known-good tag, SHA, or artifact id to redeploy
        required: true

permissions:
  contents: read

# Share the deploy lock with the normal deploy workflow so a rollback and a
# regular release can never publish at the same time.
concurrency:
  group: request-organizer-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Redeploy known-good release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve rollback target
        id: resolve
        env:
          # The input is named release_ref, so it must be read with that exact
          # snake_case name. The starter snippet used a camelCase name that does
          # not exist, so it always resolved to an empty string.
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_REF}" ]; then
            echo "::error::No release_ref provided; refusing to roll back to an empty target."
            exit 1
          fi
          echo "Rolling back to known-good release: ${RELEASE_REF}"
          echo "ref=${RELEASE_REF}" >> "$GITHUB_OUTPUT"
          {
            echo "### T04 rollback"
            echo ""
            echo "- Requested known-good release_ref: \`${RELEASE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the known-good release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Rebuild the known-good artifact
        working-directory: team-site
        run: |
          npm ci
          npm run build

      - name: Upload known-good artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ steps.resolve.outputs.ref }}
          path: team-site/dist

      - name: Request organizer redeploy of the known-good release
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          ROLLBACK_REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYER_DISPATCH_TOKEN}" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured; the rebuilt known-good artifact above is the rollback evidence." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-thebyteforce-main-merged",
              "client_payload": {
                  "team": "thebyteforce",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["ROLLBACK_REF"],
                  "branch": "main",
                  "rollback": True,
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer redeploy of known-good release \`${ROLLBACK_REF}\`." >> "$GITHUB_STEP_SUMMARY"
