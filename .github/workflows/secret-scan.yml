name: Secret Scan

# T27 - Secret Leak Drill: the prevention gate.
#
# Runs on every pull request and every push to main, so the seeded token - and
# anything else credential-shaped - cannot reach main after the drill is over.
# A one-time cleanup fixes today; a gate fixes every day after it.
#
# Deliberately receives NO secrets. A workflow whose job is to detect leaked
# credentials has no business holding any, and giving it access would mean a bug
# in the scanner could print the very thing it exists to protect.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan source, workflows and build output
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history: the scan covers what is in the tree now, and the extra
      # depth lets the audit step below inspect other refs rather than only HEAD.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      # Generated output is scanned too. Source can be clean while a build-time
      # generator writes a secret into dist/ - which is what actually ships.
      - name: Build so generated output can be scanned
        run: npm run build
        working-directory: team-site

      - name: Scan for leaked credentials
        run: |
          set -euo pipefail
          chmod +x scripts/scan-secrets.sh
          scripts/scan-secrets.sh --include-dist

      # Containment reporting, not a gate. The seeded token lives on an
      # organizer-owned branch we cannot delete; recording which refs still carry
      # it is the honest position, and it fails only if main is affected.
      - name: Report which refs still carry the seeded token
        run: |
          set -euo pipefail

          # Assembled, never a literal - see scripts/scan-secrets.sh.
          prefix='DEPLOY_SPRINT_TEST_TOKEN'
          suffix='T23_DO_NOT_USE'
          needle="${prefix}_${suffix}"

          echo "refs containing the seeded token:"
          affected=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin); do
            if git grep -I -q -F -- "$needle" "$ref" -- . 2>/dev/null; then
              echo "  ${ref}"
              affected=$((affected + 1))
              case "$ref" in
                refs/remotes/origin/main)
                  echo "::error::the seeded token is present on main"
                  exit 1
                  ;;
              esac
            fi
          done
          [ "$affected" = "0" ] && echo "  (none)"
          echo "main is clean."

      - name: Scan summary
        if: always()
        run: |
          {
            echo "## T27 secret scan"
            echo ""
            echo "| Check | Scope |"
            echo "| --- | --- |"
            echo "| Seeded drill token | tracked source + generated \`dist/\` |"
            echo "| Credential-shaped strings | private keys, GitHub PAT/OAuth, AWS key ids, Resend keys |"
            echo "| Workflows printing secrets | every file in \`.github/workflows\` |"
            echo "| Containment | every \`origin/*\` ref; fails only if \`main\` is affected |"
            echo ""
            echo "This job is granted no secrets. See \`docs/incidents/seeded-secret-leak.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
